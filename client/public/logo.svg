<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <!-- Background Icon Gradient -->
    <linearGradient id="icon-bg-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#009b77" />
      <stop offset="50%" stop-color="#00c598" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glyph Gradient -->
    <linearGradient id="ar-glyph-grad" x1="10" y1="8" x2="22" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00c598" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="ar-rect-border" x1="6" y1="4" x2="26" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00c598" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.5" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c598" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Sparkle Gradient -->
    <linearGradient id="sparkle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00c598" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Left Logo Icon Badge (64x64 at x=8, y=8) -->
  <g transform="translate(8, 8)" filter="url(#shadow)">
    <!-- Outer Border with Rounded Corners -->
    <rect x="0" y="0" width="64" height="64" rx="20" fill="url(#icon-bg-border)" />
    <!-- Inner Dark Core -->
    <rect x="2.5" y="2.5" width="59" height="59" rx="18" fill="#0f172a" />

    <!-- Vector Icon Details scaled up -->
    <g transform="translate(8, 8) scale(1.5)">
      <!-- Resume Sheet Plate -->
      <rect x="6" y="4" width="20" height="24" rx="3.5" fill="#ffffff" fill-opacity="0.08" stroke="url(#ar-rect-border)" stroke-width="1.2" />
      
      <!-- 'A' Lettermark / Dynamic Lighting -->
      <path d="M10 20L15.2 8.5C15.5 7.8 16.5 7.8 16.8 8.5L22 20M11.8 16.2H20.2" stroke="url(#ar-glyph-grad)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Sparkle -->
      <path d="M21 9L23 5L25 9L29 11L25 13L23 17L21 9Z" fill="url(#sparkle-grad)" transform="scale(0.35) translate(30, 8)" />
      
      <!-- Bottom Highlight Bar -->
      <rect x="10" y="23.5" width="12" height="1.8" rx="0.9" fill="#00c598" fill-opacity="0.9" />
    </g>
  </g>

  <!-- Typography Brand Text -->
  <!-- "Auto" -->
  <text x="86" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#0f172a" letter-spacing="-0.5">Auto</text>

  <!-- "Resume" -->
  <text x="166" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="url(#text-gradient)" letter-spacing="-0.5">Resume</text>

  <!-- Badge "A4 PRO" -->
  <g transform="translate(250, 24)">
    <rect x="0" y="0" width="58" height="22" rx="11" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
    <text x="29" y="15" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#009b77" text-anchor="middle" letter-spacing="0.5">A4 PRO</text>
  </g>
</svg>
